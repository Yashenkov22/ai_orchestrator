  ai_psql_db:
    image: postgres:14
    # restart: always
    networks:
      - shared_network
    ports:
      - '5642:5432'
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Moscow
    cpus: '1.0'
    mem_limit: 2g
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    # command: postgres -c max_connections=200 -c shared_buffers=2GB
    # command: postgres -c max_connections=100 -c shared_buffers=2GB -c work_mem=16MB -c maintenance_work_mem=512MB -c effective_cache_size=6GB
    logging:
      driver: "json-file"


# services:
  backend:
    build: .
    container_name: backend_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=ai_psql_db
      - REDIS_HOST=ai_redis_db
      - DB_PORT=5432
      - REDIS_PORT=6379
    networks:
      - shared_network

volumes:
  ai-postgres-data:
  media_data:
    name: shared_media_data

networks:
  shared_network:
    external: true

