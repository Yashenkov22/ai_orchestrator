services:

  ai_psql_db:
    image: postgres:14
    restart: always
    networks:
      - shared_network
    ports:
      - '5642:5432'
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Moscow
    cpus: '1.0'
    mem_limit: 2g
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    # command: postgres -c max_connections=200 -c shared_buffers=2GB
    # command: postgres -c max_connections=100 -c shared_buffers=2GB -c work_mem=16MB -c maintenance_work_mem=512MB -c effective_cache_size=6GB
    logging:
      driver: "json-file"

  backend:
    build: .
    container_name: backend_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${MEDIA_PATH}:/app/media
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=ai_psql_db
      - REDIS_HOST=ai_redis_db
      - DB_PORT=5432
      - REDIS_PORT=6379
      - TRANSLATOR_URL=translator
    networks:
      - shared_network

  ai_redis_db:
    image: redis:latest
    restart: always
    cpus: '0.5'
    ports:
      - 6172:6379
    env_file:
      - ./.env
    networks:
     - shared_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
    volumes:
      - ai_redis_data:/data
    logging:
      driver: "json-file"
      options:
          max-size: "20m"

  translator:
    build:
      context: ./translator
    container_name: translator_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - ./translator:/app
      - huggingface_cache:/models
    env_file:
      - ./.env
    environment:
      HF_HOME: /models
    networks:
      - shared_network

volumes:
  ai-postgres-data:
  ai_redis_data:
  huggingface_cache:

networks:
  shared_network:
    external: true